services:
  mongodb:
    image: mongo:7.0.48
    container_name: mongo-java-server-test
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    tmpfs:
      - /data:rw
    ports:
      - 127.0.0.1:27018:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:9.6-alpine
    container_name: postgres-mongo-java-server-test
    tmpfs:
      - /var/lib/postgresql/data:rw
    environment:
      - POSTGRES_USER=mongo-java-server-test
      - POSTGRES_PASSWORD=mongo-java-server-test
      - POSTGRES_DB=mongo-java-server-test
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube
    container_name: mongo-java-server-sonarqube
    ports:
      - 127.0.0.1:9000:9000
