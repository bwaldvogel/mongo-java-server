dependencies {
    api project(':mongo-java-server-memory-backend')

    api 'org.mongodb:mongo-java-driver:latest.release'

    api 'org.junit.jupiter:junit-jupiter-api:latest.release'
    api 'org.junit.jupiter:junit-jupiter-params:latest.release'
    api 'org.assertj:assertj-core:latest.release'

    runtimeOnly 'ch.qos.logback:logback-classic:latest.release'
}

sourceSets {
    test {
        java.srcDirs += [
            sourceSets.main.allJava
        ]
    }
}
